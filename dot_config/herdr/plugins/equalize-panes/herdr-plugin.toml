id = "local.equalize-panes"
name = "Equalize Panes"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "現在のtab内の全paneのsplit木構造を維持したまま、各splitのratioを均等値に再計算して見やすく整列させる"
platforms = ["macos"]

[[actions]]
id = "equalize"
title = "Equalize panes in current tab"
contexts = ["tab"]
command = ["bash", "equalize.sh"]

# herdr本来のsplit/close keybind、CLI、シェル内`exit`等、経路を問わずpane数が
# 増減した場合でも自動的にequalizeが走るようにするイベントフック。
[[events]]
on = "pane.closed"
command = ["bash", "equalize.sh"]

[[events]]
on = "pane.created"
command = ["bash", "equalize.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "equalize.sh"]
