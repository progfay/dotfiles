id = "local.focus-pane"
name = "Focus Pane by Index"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "現在のtab内でN番目(作成順)のpaneに、agentの起動有無に関係なくフォーカスを移す"
platforms = ["macos"]

[[actions]]
id = "focus-1"
title = "Focus pane 1"
contexts = ["tab"]
command = ["bash", "focus-pane.sh", "1"]

